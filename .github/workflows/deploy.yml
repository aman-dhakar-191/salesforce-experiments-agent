name: Deploy to Salesforce

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli

      - name: Auth to Salesforce
        run: |
          echo "${{ secrets.SF_SERVER_KEY }}" | base64 -d > server.key
          sf org login jwt \
            --client-id ${{ secrets.SF_CONSUMER_KEY }} \
            --jwt-key-file server.key \
            --username ${{ secrets.SF_USERNAME }} \
            --instance-url ${{ secrets.SF_INSTANCE_URL }} \
            --set-default \
            --alias ci

      - name: Get changed files
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- force-app/)
          else
            CHANGED=$(git diff --name-only HEAD~1 HEAD -- force-app/)
          fi
          echo "files<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGED" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          if [ -n "$CHANGED" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Validate (dry run)
        if: github.event_name == 'pull_request' && steps.changes.outputs.has_changes == 'true'
        run: |
          sf project deploy start --source-dir force-app --dry-run --wait 30 --target-org ci

      - name: Deploy changed components
        if: github.event_name == 'push' && steps.changes.outputs.has_changes == 'true'
        run: |
          sf project deploy start --source-dir force-app --wait 30 --target-org ci

      - name: Cleanup
        if: always()
        run: rm -f server.key
