name: Deploy to Salesforce

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli

      - name: Auth to Salesforce
        run: |
          echo "${{ secrets.SF_SERVER_KEY }}" > server.key
          sf org login jwt \
            --client-id ${{ secrets.SF_CONSUMER_KEY }} \
            --jwt-key-file server.key \
            --username ${{ secrets.SF_USERNAME }} \
            --instance-url ${{ secrets.SF_INSTANCE_URL }} \
            --set-default-dev-hub \
            --alias ci

      - name: Get changed files
        id: changes
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD -- force-app/)
          echo "files<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGED" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          if [ -n "$CHANGED" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Deploy changed components
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          DIRS=$(echo "${{ steps.changes.outputs.files }}" \
            | sed 's|/[^/]*$||' \
            | sort -u \
            | tr '\n' ' ')
          echo "Deploying dirs: $DIRS"
          sf project deploy start --source-dir $DIRS --wait 30 --target-org ci

      - name: Cleanup
        if: always()
        run: rm -f server.key
